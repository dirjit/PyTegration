# =============================================================================
# CI pipeline — runs the same quality gate as `make all` on every push/PR
# =============================================================================
# LESSON: Module 0 / Module 7 (Testing & automation).
#
# JAVA NOTE: GitHub Actions here plays the role of a Jenkins pipeline or a
#   `mvn verify` gate enforced on every change. The job below is the remote
#   guardian of the same checks you run locally with `make all`.
#
# SECURITY: this workflow needs NO secrets. The test suite forces
#   LLM_PROVIDER=mock, so the agent runs fully offline — no Anthropic key is
#   ever exposed to CI.
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # The agent endpoint and its tests run against the deterministic mock.
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      # Each step is a separate gate so a failure points at the exact stage.
      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Tests (pytest)
        run: pytest

      # Non-blocking advisory scan for known CVEs in dependencies.
      - name: Dependency audit (advisory)
        run: pip-audit || true
