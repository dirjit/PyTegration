<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Galaxy System Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed WebGL canvas, floating top bar, bottom stack (time bar + info card), right-hand drawer for search. */
:root{
  --bg:#04060d;            /* deep space, slight blue bias */
  --panel:rgba(9,13,25,.80);
  --panel-solid:#0b1020;
  --line:rgba(150,180,255,.16);
  --fg:#e9eefb;
  --mute:#8f9cb9;
  --accent:#ffb454;        /* solar amber: primary actions */
  --accent-ink:#1a1204;
  --cool:#7fb4ff;          /* orbit / selection blue */
  --good:#6fd6a3;
  --font-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;letter-spacing:.02em;color:rgba(233,238,251,.86);text-shadow:0 0 4px #000,0 0 8px #000;will-change:transform;display:none}
.lbl span{display:block;transform:translate(10px,-50%)}
.lbl.star span{font-weight:600;color:#fff}
.lbl.moon span{font-size:10px;color:rgba(190,205,235,.7)}
.lbl.region span{text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:rgba(160,190,255,.8)}
.lbl.ring span{font-size:10px;color:rgba(150,180,255,.5);transform:translate(4px,-120%)}
.lbl.sel span{color:var(--accent)}
#reticle{position:absolute;left:0;top:0;width:10px;height:10px;border:1.5px solid var(--accent);border-radius:50%;pointer-events:none;display:none;box-shadow:0 0 10px rgba(255,180,84,.5)}

/* top bar */
#top{position:absolute;left:0;right:0;top:0;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.brand{font:700 15px/1 var(--font-display);letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0;white-space:nowrap}
.brand i{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--accent) 45%,#c2601a);box-shadow:0 0 12px var(--accent)}
.ibtn{height:36px;min-width:36px;padding:0 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--fg)}
.ibtn:hover{border-color:rgba(150,180,255,.4)}
.ibtn[aria-pressed="true"]{border-color:var(--cool);color:var(--cool)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);align-self:flex-start;max-width:100%;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--mute);white-space:nowrap;font-weight:500;font-size:13px}
#tabs button[aria-selected="true"]{background:rgba(127,180,255,.16);color:#fff}
#tabs small{display:block;font-size:10px;color:var(--mute);margin-top:-1px;font-weight:400}

/* menu */
#menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:54px;width:min(280px,calc(100% - 32px));background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:10px 12px;z-index:5;box-shadow:0 18px 50px rgba(0,0,0,.6)}
#menu h3{margin:2px 0 8px;font:600 11px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#menu label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
#menu label:first-of-type{border-top:0}
#menu input[type=checkbox]{appearance:none;width:34px;height:20px;border-radius:20px;background:#27304a;position:relative;flex:none;cursor:pointer;transition:background .15s}
#menu input[type=checkbox]::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#cdd6ee;transition:transform .15s}
#menu input[type=checkbox]:checked{background:var(--cool)}
#menu input[type=checkbox]:checked::after{transform:translateX(14px);background:#fff}
#menu small{color:var(--mute);display:block;font-size:11px}

/* bottom stack */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-start}
#bottom>*{pointer-events:auto}
#timebar{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);width:100%;max-width:520px}
#timebar .date{font:500 12px var(--font-body);font-variant-numeric:tabular-nums;min-width:86px;text-align:right;color:var(--fg)}
#timebar .rate{font:500 11px var(--font-body);color:var(--mute);min-width:62px;font-variant-numeric:tabular-nums}
#speed{flex:1;min-width:60px;accent-color:var(--cool)}
#info{width:100%;max-width:520px;max-height:44vh;overflow:auto;border-radius:16px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);padding:12px 14px 14px;overscroll-behavior:contain}
#info .kind{font:600 10.5px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--cool)}
#info h2{margin:2px 0 0;font:700 22px/1.15 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
#info .sub{margin:2px 0 0;color:var(--mute);font-size:12.5px}
#info .head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
#info .head>div{min-width:0}
#info .fold{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mute)}
#info dl{margin:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 14px}
#info dl div{min-width:0}
#info dt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#info dd{margin:0;font-variant-numeric:tabular-nums;font-weight:500;overflow-wrap:anywhere}
#info p.desc{margin:10px 0 0;color:#c9d3ea;max-width:65ch}
#info .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#info.min dl,#info.min p.desc{display:none}
#info.min .acts{margin-top:10px}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(127,180,255,.1);color:var(--fg);font-weight:500}
.btn:hover{border-color:rgba(150,180,255,.45)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);font:500 10.5px var(--font-body);color:var(--mute);letter-spacing:.02em;text-transform:none;vertical-align:middle}
.tag.good{color:var(--good);border-color:rgba(111,214,163,.4)}

/* browse drawer */
#browse{position:absolute;top:0;bottom:0;right:0;width:min(380px,100%);background:var(--panel-solid);border-left:1px solid var(--line);z-index:6;display:flex;flex-direction:column;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 12px;box-shadow:-18px 0 50px rgba(0,0,0,.5)}
#browse .bar{display:flex;gap:8px;margin-bottom:8px}
#q{flex:1;min-width:0;height:38px;border-radius:10px;border:1px solid var(--line);background:#0e1426;padding:0 12px;outline:none}
#q:focus{border-color:var(--cool)}
#results{flex:1;overflow:auto;margin:0;padding:0;list-style:none;overscroll-behavior:contain}
#results h4{margin:14px 0 4px;font:600 10.5px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#results button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 8px;display:flex;justify-content:space-between;gap:10px}
#results button:hover,#results button:focus-visible{background:rgba(127,180,255,.1)}
#results .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
#results .mt{color:var(--mute);font-size:12px;white-space:nowrap}

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:4}
#fade.on{opacity:1}
#hint{position:absolute;left:50%;top:104px;transform:translateX(-50%);padding:7px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--mute);font-size:12px;pointer-events:none;transition:opacity .6s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#hint.off{opacity:0}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--mute);z-index:9}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--mute);font-size:13px;letter-spacing:.1em;text-transform:uppercase;z-index:3}
#tabSystem{max-width:130px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:460px){#tabs button{padding:7px 8px;font-size:12.5px}#info{max-height:38vh}#info h2{font-size:19px}}
@media (min-width:820px){
  #bottom{flex-direction:column-reverse}
  #hint{top:60px}
}
@media (prefers-reduced-motion:reduce){#fade,#hint{transition:none}}
</style>
</head>
<body>

<div id="app">
  <canvas id="gl" aria-label="3D galaxy view"></canvas>
  <div id="labels"></div>
  <div id="reticle"></div>

  <header id="top">
    <div class="row">
      <div class="brand"><i></i>Galaxy System Explorer</div>
      <button class="ibtn" id="btnUp" title="Zoom out one level" aria-label="Zoom out one level"><svg viewBox="0 0 24 24"><path d="M4 14v6h6M20 10V4h-6M4 20l7-7M20 4l-7 7"/></svg></button>
      <button class="ibtn" id="btnSearch" title="Search and browse" aria-label="Search and browse"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button class="ibtn" id="btnMenu" title="Display options" aria-label="Display options" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </div>
    <nav id="tabs" role="tablist" aria-label="Scale">
      <button role="tab" data-level="group">Local Group</button>
      <button role="tab" data-level="galaxy">Milky Way</button>
      <button role="tab" data-level="near">Neighborhood</button>
      <button role="tab" data-level="system" id="tabSystem">Solar System</button>
    </nav>
  </header>

  <section id="menu" hidden aria-label="Display options">
    <h3>Display</h3>
    <label>Orbit lines <input type="checkbox" id="o_orbits" checked></label>
    <label>Labels <input type="checkbox" id="o_labels" checked></label>
    <label>Moons <input type="checkbox" id="o_moons" checked></label>
    <label>Belts and debris <input type="checkbox" id="o_belts" checked></label>
    <label><span>Habitable zone<small>Where liquid water could last on a rocky surface</small></span> <input type="checkbox" id="o_hz" checked></label>
    <label><span>True-scale sizes<small>Real body sizes against real distances</small></span> <input type="checkbox" id="o_true"></label>
    <label><span>Galaxy rotation<small>Slow spin of the Milky Way disc</small></span> <input type="checkbox" id="o_rotate" checked></label>
    <label>Distance grid <input type="checkbox" id="o_grid" checked></label>
    <label>Background stars <input type="checkbox" id="o_sky" checked></label>
  </section>

  <div id="bottom">
    <div id="timebar" hidden>
      <button class="ibtn" id="btnPlay" aria-label="Pause" title="Play / pause"><svg viewBox="0 0 24 24" id="icoPlay"><path d="M8 5v14M16 5v14"/></svg></button>
      <button class="ibtn" id="btnRev" aria-label="Reverse time" title="Reverse time" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></button>
      <input type="range" id="speed" min="0" max="100" step="1" aria-label="Time speed">
      <span class="rate" id="rate"></span>
      <button class="ibtn" id="btnNow" title="Jump to today's planet positions" style="font-size:12px">Today</button>
      <span class="date" id="date"></span>
    </div>
    <div id="info"></div>
  </div>

  <aside id="browse" hidden aria-label="Search and browse">
    <div class="bar"><input id="q" type="search" placeholder="Search planets, moons, stars, galaxies" autocomplete="off" aria-label="Search"><button class="ibtn" id="btnCloseBrowse" aria-label="Close search">✕</button></div>
    <ul id="results"></ul>
  </aside>

  <div id="loading">Loading universe…</div>
  <div id="hint">Drag to orbit · pinch or scroll to zoom · tap an object</div>
  <div id="err"><div><b>WebGL is unavailable.</b><br>This explorer needs a browser with WebGL enabled.</div></div>
  <div id="fade"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* =====================================================================
   DATA
   Orbital elements for the eight planets and Pluto are the JPL
   "Keplerian elements for approximate positions" (J2000, valid 1800-2050).
   Exoplanet values are rounded from published discovery papers; where a
   radius is not measured it is estimated from mass and flagged "est.".
   ===================================================================== */
const RE_KM = 6371;

// moons: a = semi-major axis (km), P = period (days), R = radius (km), inc = orbital-plane tilt to the ecliptic (deg)
const MOONS = {
  Earth: { inc: 5.1, list: [
    { n:'Moon', a:384400, P:27.32, R:1737.4, tex:'moon', desc:'The only place beyond Earth that people have walked. Tidally locked, it always shows the same face and drifts away from Earth by about 3.8 cm a year.' } ]},
  Mars: { inc: 25, list: [
    { n:'Phobos', a:9376, P:0.319, R:11.1, tex:'dark', desc:'A lumpy, crater-scarred moon that circles Mars in under eight hours, faster than Mars itself turns. It is slowly spiralling inward.' },
    { n:'Deimos', a:23463, P:1.263, R:6.2, tex:'dark', desc:'The smaller and more distant of Mars’s two moons, smooth with a thick coat of dust.' } ]},
  Jupiter: { inc: 3, list: [
    { n:'Io', a:421800, P:1.769, R:1821.6, tex:'io', desc:'The most volcanically active world known, with hundreds of volcanoes flexed by Jupiter’s tides.' },
    { n:'Europa', a:671100, P:3.551, R:1560.8, tex:'europa', desc:'An ice shell covers a global salt-water ocean holding roughly twice the water of all Earth’s seas.' },

    { n:'Enceladus', a:238040, P:1.370, R:252.1, tex:'ice', desc:'Geysers at its south pole spray ocean water into space and feed Saturn’s E ring.' },
    { n:'Tethys', a:294670, P:1.888, R:531.1, tex:'ice', desc:'Almost pure water ice, split by a 2,000 km long canyon called Ithaca Chasma.' },
    { n:'Dione', a:377420, P:2.737, R:561.4, tex:'icegrey', desc:'An icy moon with bright wispy cliffs and a thin oxygen exosphere.' },
    { n:'Rhea', a:527070, P:4.518, R:763.8, tex:'icegrey', desc:'Saturn’s second-largest moon, a heavily cratered ball of ice and rock.' },
    { n:'Titan', a:1221870, P:15.945, R:2574.7, tex:'titan', atmo:'#e0a050', desc:'Wrapped in a thick orange nitrogen atmosphere, with lakes and seas of liquid methane. The Dragonfly rotorcraft is due to fly there in the 2030s.' },
    { n:'Iapetus', a:3560820, P:79.33, R:734.5, tex:'iapetus', desc:'Two-toned: one hemisphere is coal-dark, the other bright as snow. A ridge circles its equator.' } ]},
  Uranus: { inc: 97.8, list: [
    { n:'Miranda', a:129900, P:1.413, R:235.8, tex:'icegrey', desc:'A patchwork of canyons and terraced cliffs, with some of the tallest known cliffs in the Solar System.' },
    { n:'Ariel', a:190900, P:2.520, R:578.9, tex:'icegrey', desc:'The brightest of Uranus’s moons, cut by long valleys.' },
    { n:'Umbriel', a:266000, P:4.144, R:584.7, tex:'dark', desc:'A dark, old, cratered surface with one bright ring-shaped feature.' },
    { n:'Titania', a:436300, P:8.706, R:788.4, tex:'icegrey', desc:'The largest moon of Uranus, with huge canyons.' },
    { n:'Oberon', a:583500, P:13.46, R:761.4, tex:'dark', desc:'An outer moon with old, dark, heavily cratered terrain.' } ]},
  Neptune: { inc: 157, list: [
    { n:'Proteus', a:117647, P:1.122, R:210, tex:'dark', desc:'A dark, irregular moon, nearly as large as a body can be before gravity pulls it round.' },
    { n:'Triton', a:354800, P:5.877, R:1353.4, tex:'triton', desc:'Orbits backwards, which shows it is a captured Kuiper Belt object. Nitrogen geysers erupt from its pink-tinged ice.' } ]},
  Pluto: { inc: 119.6, list: [
    { n:'Charon', a:19591, P:6.387, R:606, tex:'charon', desc:'Half the width of Pluto. The two bodies orbit a point in the space between them and keep the same faces toward each other.' } ]},
};

// kind: planet | dwarf. Elements: a (AU), e, i (deg), node (deg), varpi (deg), L (mean longitude at J2000, deg), P (years)
const SOL_PLANETS = [
 { n:'Mercury', kind:'planet', cls:'Terrestrial planet', a:0.38709927, e:0.20563593, i:7.00497902, node:48.33076593, varpi:77.45779628, L:252.25032350, P:0.24084,
   Rkm:2439.7, mass:'0.055 Earths', rot:1407.6, tilt:0.03, g:'3.7 m/s²', temp:'−180 to 430 °C', moons:'0', tex:'mercury', col:'#a39a92',
   desc:'The smallest planet and the closest to the Sun. With almost no atmosphere, its surface swings from scorching days to freezing nights. One solar day lasts two Mercury years.' },
 { n:'Venus', kind:'planet', cls:'Terrestrial planet', a:0.72333566, e:0.00677672, i:3.39467605, node:76.67984255, varpi:131.60246718, L:181.97909950, P:0.61519,
   Rkm:6051.8, mass:'0.815 Earths', rot:-5832.5, tilt:177.4, g:'8.87 m/s²', temp:'464 °C', moons:'0', tex:'venus', col:'#e3c98f', atmo:'#f3d9a0',
   desc:'Almost Earth’s size but crushed under a carbon dioxide atmosphere 90 times denser than ours. The hottest planet, and it spins backwards so slowly that its day outlasts its year.' },
 { n:'Earth', kind:'planet', cls:'Terrestrial planet', a:1.00000261, e:0.01671123, i:-0.00001531, node:0, varpi:102.93768193, L:100.46457166, P:1.00002,
   Rkm:6371, mass:'1 Earth', rot:23.934, tilt:23.44, g:'9.81 m/s²', temp:'15 °C average', moons:'1', tex:'earth', col:'#3f78c2', atmo:'#6aa8ff', clouds:true,
   desc:'The only world known to host life. Liquid water covers 71% of its surface, held in place by an atmosphere of nitrogen and oxygen.' },
 { n:'Mars', kind:'planet', cls:'Terrestrial planet', a:1.52371034, e:0.09339410, i:1.84969142, node:49.55953891, varpi:-23.94362959, L:-4.55343205, P:1.88085,
   Rkm:3389.5, mass:'0.107 Earths', rot:24.623, tilt:25.19, g:'3.71 m/s²', temp:'−63 °C average', moons:'2', tex:'mars', col:'#c0643a', atmo:'#d99a70',
   desc:'A cold desert with the tallest volcano (Olympus Mons) and the deepest canyon system (Valles Marineris) known. Dry river valleys show that water once flowed here.' },
 { n:'Jupiter', kind:'planet', cls:'Gas giant', a:5.20288700, e:0.04838624, i:1.30439695, node:100.47390909, varpi:14.72847983, L:34.39644051, P:11.8620,
   Rkm:69911, mass:'317.8 Earths', rot:9.925, tilt:3.13, g:'24.8 m/s²', temp:'−108 °C (cloud tops)', moons:'95+ known', tex:'jupiter', col:'#d2b08a', atmo:'#e8d2b0',
   desc:'More than twice as massive as all other planets combined. Its Great Red Spot is a storm wider than Earth that has raged for at least 190 years.' },
 { n:'Saturn', kind:'planet', cls:'Gas giant', a:9.53667594, e:0.05386179, i:2.48599187, node:113.66242448, varpi:92.59887831, L:49.95424423, P:29.4571,

  let extent = 0; for (const p of planets) extent = Math.max(extent, p.a * UAU * (1 + (p.e || 0))); for (const b of beltDefs) extent = Math.max(extent, b.out * UAU); if (bin) extent = Math.max(extent, st.orbit.a * UAU * (1 + st.orbit.e));
  const start = st.start || Math.max(extent * 2.6, comps[0].Rx * 10, 20);

  function setScales() {
    for (const b of bodies) if (b.setScale) b.setScale();
    for (const b of planetBodies) for (const m of b.moons) m.setScale();
    // moons are placed relative to the parent's *current* size
    for (const b of planetBodies) for (const m of b.moons) m.setScale();
  }
  setScales();
  const tv = new V3();
  function update(dt) {
    const d = time.days;
    if (bin) { orbitPos(binOrbit, keplerSolve(binM0 + TAU * d / (st.orbit.P * 365.25), st.orbit.e), tv); const f = comps[1].M / Mtot; starBodies[0].pivot.position.copy(tv).multiplyScalar(f); starBodies[1].pivot.position.copy(tv).multiplyScalar(-(1 - f)); }
    for (const b of planetBodies) { orbitPos(b.o, keplerSolve(b.M0 + TAU * d / b.Pd, b.o.e), b.pivot.position); for (const m of b.moons) { const th = m.ph + TAU * d / m.Pd; m.pivot.position.set(m.dist * Math.cos(th), 0, -m.dist * Math.sin(th)); } }
    g.updateMatrixWorld(true);
    const f = focalPx(), cp = camera.position;
    for (const b of bodies) {
      if (b.pivot) b.pos.setFromMatrixPosition(b.pivot.matrixWorld);
      if (b.dot) { const px = b.R() / Math.max(cp.distanceTo(b.pos), 1e-9) * f; b.dot.visible = px < (b.kind === 'star' ? 10 : 3.2); }
      const sp = b.spin || b.mesh; if (sp && time.playing && b.spinPerDay) { let w = b.spinPerDay * time.rate * time.dir; if (Math.abs(w) > 2.5) w = Math.sign(w) * .35; sp.rotation.y += w * dt; }
    }
    for (const bt of belts) { const pa = bt.pts.geometry.attributes.position.array, om = TAU / 365.25 * Math.sqrt(bt.Ms); for (let i = 0; i < bt.n; i++) { const a = bt.aa[i], th = bt.ph[i] + om * d / Math.pow(a / UAU, 1.5); pa[i*3] = a * Math.cos(th); pa[i*3+1] = bt.yy[i]; pa[i*3+2] = -a * Math.sin(th); } bt.pts.geometry.attributes.position.needsUpdate = true; }
  }
  function overview() { cam.follow = null; cam.tTarget.set(0, 0, 0); cam.offset.set(0, 0, 0); cam.tDist = start; cam.pitch = Math.max(cam.pitch, .35); }
  function applyOpts() {
    for (const b of orbitLines) b.visible = S.orbits;
    for (const b of planetBodies) for (const m of b.moons) { m.pivot.visible = S.moons; m.line.visible = S.orbits && S.moons; }
    for (const bt of belts) bt.pts.visible = S.belts; hz.visible = S.hz && !bin; setScales();
  }
  function onSelect(it) { for (const b of bodies) if (b.line && !b.parentLine) b.line.material.opacity = (it && it.body === b) ? .95 : .42; for (const b of bodies) if (b.parentLine) b.line.material.opacity = (it && it.body === b) ? .9 : .28; }
  return { st, g, items: () => items, labels, bodies, update, overview, start, extent, applyOpts, onSelect, comps, Ltot, firstItem: starBodies[0].item, planetBodies, aU };
}

const sysCache = new Map(); let sys = null;
views.system = {
  items: () => sys.items(), get labels() { return sys.labels; },
  enter(o) {
    const st = STARS.find(s => s.id === (o.star || 'sol')); if (!sys || sys.st !== st) { sys = sysCache.get(st.id) || buildSystem(st); sysCache.set(st.id, sys); }
    scene.add(sys.g); $('tabSystem').textContent = st.sys || st.n; time.rate = st.speed || 10; time.days = st.id === 'sol' ? (Date.now() - Date.UTC(2000, 0, 1, 12)) / 864e5 : 0; time.t0 = time.days; time.playing = true; time.dir = 1;
    setCam({ dist: sys.start, pitch: .55, yaw: .6, target: new V3(), min: 1e-4, max: Math.max(sys.start * 10, 400) }); sys.applyOpts(); setSpeedUI(); this.applyOptions();
    select(sys.firstItem, false);
  },
  leave() { scene.remove(sys.g); sys.labels.forEach(L => { L.el.style.display = 'none'; L.on = false; }); },
  applyOptions() { sys.applyOpts(); if (selected && !selected.noReticle && selected.kind === 'moon' && !S.moons) select(sys.firstItem, true); },
  onSelect(it) { sys.onSelect(it); },
  update(dt) { sys.update(dt); },
};

/* =====================================================================
   NAVIGATION, TIME, SEARCH, LOOP
   ===================================================================== */
const cur = { star: 'sol' }, J2000 = Date.UTC(2000, 0, 1, 12);
const LEVELS = ['group', 'galaxy', 'near', 'system'];
async function go(lv, opts = {}) {
  if (navBusy) return; navBusy = true;
  try {
    const first = !view; if (!first) { $('fade').classList.add('on'); await sleep(280); }
    if (view) view.leave();
    if (lv === 'system') cur.star = opts.star || cur.star || 'sol';
    level = lv; view = views[lv]; view.enter(lv === 'system' ? { star: cur.star } : opts);
    if (opts.select) { const it = view.items().find(i => i.name === opts.select || i.id === opts.select); if (it) select(it, true); }
    syncUI(); $('fade').classList.remove('on');
  } catch (e) { console.error(e); $('fade').classList.remove('on'); } finally { navBusy = false; }
}
function navigate(s) {   // s: { level, star, select }
  if (s.level === level && (level !== 'system' || cur.star === (s.star || cur.star))) { const it = view.items().find(i => i.name === s.select); if (it) select(it, true); return; }
  go(s.level, { star: s.star, select: s.select });
}
function syncUI() {
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.level === level)));
  $('timebar').hidden = level !== 'system'; $('btnUp').disabled = level === 'group'; $('btnUp').style.opacity = level === 'group' ? .4 : 1;
  const st = STARS.find(s => s.id === cur.star); $('tabSystem').textContent = (st && (st.sys || st.n)) || 'System';
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { if (b.dataset.level !== level) go(b.dataset.level, b.dataset.level === 'system' ? { star: cur.star } : {}); });
$('btnUp').onclick = () => { const i = LEVELS.indexOf(level); if (i > 0) go(LEVELS[i - 1]); };
canvas.addEventListener('pointerdown', () => { if (!$('menu').hidden) { $('menu').hidden = true; $('btnMenu').setAttribute('aria-pressed', 'false'); } });

/* time controls */
const rateOf = v => Math.pow(10, -1.5 + 6.5 * v / 100), vOf = r => (Math.log10(r) + 1.5) / 6.5 * 100;
const fmtRate = r => r < 1 ? fmt(r * 24, 1) + ' h/s' : r < 365.25 ? fmt(r, r < 10 ? 1 : 0) + ' d/s' : fmt(r / 365.25, r / 365.25 < 10 ? 1 : 0) + ' yr/s';
function setSpeedUI() { $('speed').value = vOf(time.rate); $('btnNow').textContent = cur.star === 'sol' ? 'Today' : 'Reset'; playIcon(); $('btnRev').setAttribute('aria-pressed', String(time.dir < 0)); }
function playIcon() { $('icoPlay').innerHTML = time.playing ? '<path d="M8 5v14M16 5v14"/>' : '<path d="M7 5l12 7-12 7z"/>'; $('btnPlay').setAttribute('aria-label', time.playing ? 'Pause' : 'Play'); }
$('speed').oninput = e => { time.rate = rateOf(+e.target.value); };
$('btnPlay').onclick = () => { time.playing = !time.playing; playIcon(); };
$('btnRev').onclick = () => { time.dir *= -1; $('btnRev').setAttribute('aria-pressed', String(time.dir < 0)); };
$('btnNow').onclick = () => { time.days = cur.star === 'sol' ? (Date.now() - J2000) / 864e5 : 0; time.t0 = time.days; };
function updateTimeUI() {
  if (level !== 'system') return; $('rate').textContent = fmtRate(time.rate) + (time.dir < 0 ? ' ↩' : '');
  let s; if (cur.star === 'sol') { const d = new Date(J2000 + time.days * 864e5); s = isNaN(d) ? '' : d.toISOString().slice(0, 10); } else s = 'T + ' + fmtPeriod(Math.abs(time.days - (time.t0 || 0)));
  if ($('date').textContent !== s) $('date').textContent = s;
}

/* search and browse */
const INDEX = (() => {
  const L = [];
  LOCAL.forEach(e => L.push({ n: e.n, m: e.t, lv: 'group', sec: 'Galaxies' }));
  [...ARMS.map(a => [a.n, 'Spiral arm']), ['Sagittarius A*', 'Black hole'], ['Galactic Bar', 'Structure'], ...GAL_SITES.map(s => [s.n, s.t])].forEach(([n, m]) => L.push({ n, m, lv: 'galaxy', sec: 'Milky Way' }));
  STARS.forEach(s => { L.push({ n: s.n, m: s.d ? fmtLy(s.d) : 'Home star', lv: 'near', sec: 'Nearby stars' });
    (s.plan === 'sol' ? [] : s.planets || []).forEach(p => L.push({ n: p.n, m: 'Exoplanet · ' + (s.sys || s.n), lv: 'system', star: s.id, sec: 'Exoplanets' })); });
  L.push({ n: 'Sun', m: 'Star · Solar System', lv: 'system', star: 'sol', sec: 'Solar System' });
  SOL_PLANETS.forEach(p => { L.push({ n: p.n, m: p.cls, lv: 'system', star: 'sol', sec: 'Solar System' }); ((MOONS[p.n] || {}).list || []).forEach(m => L.push({ n: m.n, m: 'Moon of ' + p.n, lv: 'system', star: 'sol', sec: 'Solar System' })); });
  L.push({ n: 'Asteroid belt', m: 'Belt', lv: 'system', star: 'sol', sec: 'Solar System' }, { n: 'Kuiper Belt', m: 'Belt', lv: 'system', star: 'sol', sec: 'Solar System' });
  return L;
})();
const SEC_BY_LEVEL = { system: ['Solar System', 'Exoplanets', 'Nearby stars', 'Milky Way', 'Galaxies'], near: ['Nearby stars', 'Exoplanets', 'Solar System', 'Milky Way', 'Galaxies'], galaxy: ['Milky Way', 'Nearby stars', 'Galaxies', 'Solar System', 'Exoplanets'], group: ['Galaxies', 'Milky Way', 'Nearby stars', 'Solar System', 'Exoplanets'] };
function renderResults() {
  const q = $('q').value.trim().toLowerCase(), ul = $('results'); ul.innerHTML = '';
  const hits = INDEX.filter(e => !q || e.n.toLowerCase().includes(q) || e.m.toLowerCase().includes(q)).slice(0, q ? 80 : 400);
  if (!hits.length) { ul.innerHTML = '<li style="color:var(--mute);padding:12px 8px">Nothing matches that name. Try a planet, a moon, a star or a galaxy.</li>'; return; }
  for (const sec of SEC_BY_LEVEL[level || 'system']) {
    const rows = hits.filter(h => h.sec === sec); if (!rows.length) continue;
    const h = document.createElement('li'); h.innerHTML = `<h4>${esc(sec)}</h4>`; ul.appendChild(h);
    for (const r of rows) { const li = document.createElement('li'), b = document.createElement('button'); b.innerHTML = `<span class="nm">${esc(r.n)}</span><span class="mt">${esc(r.m)}</span>`; b.onclick = () => { closeBrowse(); navigate({ level: r.lv, star: r.star, select: r.n }); }; li.appendChild(b); ul.appendChild(li); }
  }
}
function openBrowse() { $('browse').hidden = false; renderResults(); setTimeout(() => $('q').focus(), 30); }
function closeBrowse() { $('browse').hidden = true; }
$('btnSearch').onclick = () => $('browse').hidden ? openBrowse() : closeBrowse();
$('btnCloseBrowse').onclick = closeBrowse; $('q').oninput = renderResults;
addEventListener('keydown', e => { if (e.key === 'Escape') { closeBrowse(); $('menu').hidden = true; } else if (e.key === ' ' && document.activeElement === document.body && level === 'system') { e.preventDefault(); $('btnPlay').click(); } });

/* main loop */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (view) {
    if (level === 'system' && time.playing) time.days += time.dir * time.rate * dt;
    view.update(dt); placeCamera(dt); renderer.render(scene, camera); updateLabels(); updateTimeUI();
  }
  requestAnimationFrame(frame);
}
window.GSE = { camera, go, select, navigate, time, S, cam, get view() { return view; }, get level() { return level; }, get selected() { return selected; }, get sys() { return sys; } };
requestAnimationFrame(frame);
go('system', { star: 'sol' }).then(() => { const l = $('loading'); if (l) l.remove(); });
</script>
