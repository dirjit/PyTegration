# =============================================================================
# alembic.ini — database migration tool configuration
# =============================================================================
# LESSON: Module 5 (Persistence). See docs/05-persistence-sqlalchemy.md
#
# JAVA NOTE: Alembic is the Python ecosystem's Flyway/Liquibase. Migrations are
#   versioned scripts under migrations/versions/ that move the schema forward
#   (`upgrade`) or backward (`downgrade`), so the database schema is code-managed
#   and reproducible across every environment.
#
# NOTE: the database URL is intentionally NOT hardcoded here. migrations/env.py
#   reads it from the application Settings (the environment), so there is a
#   single source of truth and no secret lives in this committed file.
# =============================================================================

[alembic]
script_location = migrations
# Use a timestamp + slug for new revision filenames (readable history).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
